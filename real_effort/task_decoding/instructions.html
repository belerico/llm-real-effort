<div class="card">
    <div class="card-body">
        <p>
            You will see a table mapping letters to digits, followed by a number.
            Use the mapping to decode the number back into the corresponding letters
            and type the resulting word.
        </p>
        {% if incentive_text %}
        <p class="text-success"><strong>{{ incentive_text }}</strong></p>
        {% endif %}
    </div>
</div>
